name: Update public French fuel history
on:
  workflow_dispatch:
  schedule:
    # Day 1 calculates the previous complete month. Days 2/3 retry if needed;
    # after success the updater skips calculation and creates no empty commit.
    - cron: '23 7 1-3 * *'
      timezone: Europe/Paris
permissions:
  contents: write
concurrency:
  group: french-fuel-history
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Calculate without a model
        env:
          HISTORY_PERIOD: complete
          HISTORY_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$HISTORY_FORCE" = 'true' ]; then
            python -B -X utf8 update_history.py --period "$HISTORY_PERIOD" --force
          else
            python -B -X utf8 update_history.py --period "$HISTORY_PERIOD"
          fi
      - name: Publish only validated public aggregates
        run: |
          git add data/history.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh official fuel monthly aggregates'
          git push
